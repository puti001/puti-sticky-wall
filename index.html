<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puti-AI | 萬用現場共創便利貼牆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --ink: #0f172a;
      --muted: #475569;
      --subtle: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --base-font: 16px;
    }

    html.big-font { --base-font: 21px; }
    * { box-sizing: border-box; }
    html { font-size: var(--base-font); }

    html.big-font .wall { grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }
    html.big-font .sticky-text { font-size: 1.22rem; line-height: 1.5; }

    .qr-modal-card.qr-max {
      max-width: 96vw !important;
      width: 96vw;
      height: 94vh;
      max-height: 94vh;
    }
    .qr-img-zoomable {
      width: 280px;
      height: 280px;
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: zoom-in;
      transition: all 0.2s ease;
    }
    .qr-modal-card.qr-max .qr-img-zoomable {
      width: min(68vh, 78vw, 680px);
      height: min(68vh, 78vw, 680px);
      cursor: zoom-out;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 22px 22px;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Control Bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 0.65rem 1.25rem;
    }

    .topbar-row {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .brand-tag {
      background: #0f172a;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 0.3rem 0.6rem;
      border-radius: 8px;
      white-space: nowrap;
    }

    .topic-input {
      flex: 1;
      min-width: 220px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 0.42rem 0.75rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
    }

    .topic-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: var(--ink);
      font-size: 0.84rem;
      font-weight: 700;
      padding: 0.44rem 0.8rem;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s ease;
    }

    button:hover:not(:disabled) { background: #f1f5f9; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary { background: var(--accent); color: #fff; border-color: transparent; }
    button.primary:hover:not(:disabled) { filter: brightness(1.08); }
    button.dark { background: #0f172a; color: #fff; border-color: transparent; }
    button.warn { background: #fff7ed; color: #c2410c; border-color: #fdba74; }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
    .dot.live { background: #16a34a; box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.2); }

    /* Sub-toolbar */
    .subbar {
      max-width: 1440px;
      width: 100%;
      margin: 0.75rem auto 0;
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .quick-add {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex: 1;
      max-width: 680px;
      flex-wrap: wrap;
    }

    input, textarea {
      font-family: inherit;
      font-size: 0.88rem;
      padding: 0.44rem 0.7rem;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .wall-meta {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.82rem;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .pill-btn { font-size: 0.78rem; padding: 0.28rem 0.65rem; border-radius: 999px; }
    .pill-btn.active { background: #0f172a; color: #fff; border-color: #0f172a; }

    /* Sticky Notes Canvas */
    .wall-wrap {
      max-width: 1440px;
      width: 100%;
      margin: 0.85rem auto 2rem;
      padding: 0 1.25rem;
      flex: 1;
    }

    .wall {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
      align-items: start;
    }

    .sticky {
      background: #fef08a;
      border: 1px solid #eab308;
      border-radius: 4px 14px 14px 14px;
      padding: 1rem 1.05rem 0.8rem;
      min-height: 155px;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      box-shadow: 0 8px 18px -6px rgba(15, 23, 42, 0.14);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .sticky:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -6px rgba(15, 23, 42, 0.18);
    }

    .sticky.c1 { background: #fef08a; border-color: #eab308; }
    .sticky.c2 { background: #bae6fd; border-color: #38bdf8; }
    .sticky.c3 { background: #bbf7d0; border-color: #4ade80; }
    .sticky.c4 { background: #fed7aa; border-color: #fb923c; }
    .sticky.starred { box-shadow: 0 0 0 3px #2563eb, 0 12px 24px -6px rgba(37, 99, 235, 0.25); }

    .sticky-text {
      font-size: 1.02rem;
      font-weight: 600;
      line-height: 1.55;
      color: #0f172a;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .sticky-foot {
      margin-top: auto;
      padding-top: 0.45rem;
      border-top: 1px dashed rgba(15, 23, 42, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      font-size: 0.78rem;
      color: #334155;
    }

    .sticky-author {
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 115px;
    }

    .sticky-btns { display: flex; align-items: center; gap: 0.25rem; }

    .mini {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(15, 23, 42, 0.14);
    }
    .mini.on { background: #2563eb; color: #fff; border-color: #2563eb; }

    .empty-wall {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3.5rem 1.5rem;
      background: rgba(255, 255, 255, 0.88);
      border: 2px dashed #cbd5e1;
      border-radius: 18px;
      color: var(--muted);
    }
    .empty-wall h2 { margin: 0 0 0.4rem; font-size: 1.25rem; color: var(--ink); }
    .empty-wall p { margin: 0; font-size: 0.94rem; }

    /* Mobile Participant View */
    .mobile-shell {
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      padding: 0.85rem 1rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      flex: 1;
    }
    .m-header {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.85rem 1rem;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }
    .m-topic {
      font-size: 1.08rem;
      font-weight: 800;
      margin: 0.35rem 0 0;
      color: var(--ink);
    }
    .m-form {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }
    .m-like-btn {
      font-size: 0.86rem;
      padding: 0.32rem 0.72rem;
      border-radius: 999px;
      background: #fff;
      border: 1.5px solid #cbd5e1;
    }
    .m-like-btn.liked {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    /* Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal-bg.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 16px;
      max-width: 660px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 48px rgba(15, 23, 42, 0.26);
    }

    .modal-head {
      padding: 0.9rem 1.2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-head h2 { margin: 0; font-size: 1.06rem; }

    .modal-body {
      padding: 1.1rem 1.2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .modal-foot {
      padding: 0.75rem 1.2rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 0.45rem;
      background: #f8fafc;
      flex-wrap: wrap;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .field input, .field textarea { width: 100%; }

    .ai-output {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      font-size: 0.92rem;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .history-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 0.9rem;
      background: #f8fafc;
    }

    .toast {
      position: fixed;
      bottom: 1.2rem;
      right: 1.2rem;
      background: #0f172a;
      color: #fff;
      padding: 0.58rem 1rem;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 120;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    footer.site-footer {
      margin-top: auto;
      background: rgba(255, 255, 255, 0.92);
      border-top: 1px solid var(--border);
      padding: 0.9rem 1.2rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
    footer.site-footer a { color: #2563eb; font-weight: 700; }

    @media (max-width: 720px) {
      .quick-add { max-width: 100%; }
      .wall { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="appRoot" style="display:flex;flex-direction:column;flex:1;"></div>

  <!-- QR Modal (Host) -->
  <div class="modal-bg" id="qrModal">
    <div class="modal qr-modal-card" id="qrModalCard" style="max-width:480px;text-align:center;">
      <div class="modal-head">
        <h2>📱 手機掃碼貼便利貼＋互按讚</h2>
        <button type="button" data-close="qrModal">✕</button>
      </div>
      <div class="modal-body" id="qrBody" style="align-items:center;justify-content:center;flex:1;"></div>
      <div class="modal-foot">
        <button type="button" id="qrSwitchModeBtn" style="margin-right:auto;">改用 Google 表單 QR</button>
        <button type="button" id="qrMaxToggleBtn">⛶ 放到最大</button>
        <button type="button" data-close="qrModal" class="primary">關閉</button>
      </div>
    </div>
  </div>

  <!-- Setup Modal -->
  <div class="modal-bg" id="setupModal">
    <div class="modal">
      <div class="modal-head">
        <h2>⚙️ 連線與 AI 設定</h2>
        <button type="button" data-close="setupModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>1. GAS 雙向牆＋AI 代理網址（已預設接好，手機掃碼發文＋互按讚＋AI 整理全靠它）</label>
          <div style="display:flex;gap:0.4rem;">
            <input id="inGasProxyUrl" type="text" placeholder="https://script.google.com/macros/s/.../exec" style="flex:1;" />
            <button type="button" id="testProxyBtn">🔍 測試連線</button>
          </div>
          <div id="proxyStatusMsg" style="font-size:0.78rem;color:var(--subtle);margin-top:0.3rem;"></div>
        </div>
        <label style="display:flex;align-items:center;gap:0.45rem;font-size:0.86rem;font-weight:700;cursor:pointer;">
          <input type="checkbox" id="inAutoPoll" style="width:auto;" />
          開啟自動即時更新（每 5 秒自動刷新大家的新便利貼與 👍 票數）
        </label>
        <hr style="border:none;border-top:1px solid var(--border);margin:0.1rem 0;" />
        <div class="field">
          <label>2. 備用：Google 試算表網址（若只用 Google 表單收集時選填）</label>
          <input id="inSheetUrl" type="text" placeholder="https://docs.google.com/spreadsheets/d/.../edit?usp=sharing" />
        </div>
        <div class="field">
          <label>3. 備用：Google 表單網址（若想切換成傳統表單 QR 時選填）</label>
          <input id="inFormUrl" type="text" placeholder="https://forms.gle/..." />
        </div>
        <div class="field">
          <label>4. 備用直連 Gemini API Key（已走上方 GAS 代理時留空即可）</label>
          <input id="inGeminiKey" type="password" placeholder="僅存本機瀏覽器，選填" />
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" id="demoBtn">🧪 載入示範便利貼</button>
        <button type="button" id="saveSetupBtn" class="primary">💾 儲存並同步</button>
      </div>
    </div>
  </div>

  <!-- AI Summary Modal -->
  <div class="modal-bg" id="aiModal">
    <div class="modal">
      <div class="modal-head">
        <h2>✨ AI 整理結果</h2>
        <button type="button" data-close="aiModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="ai-output" id="aiOutputBox">整理中...</div>
      </div>
      <div class="modal-foot">
        <button type="button" id="copyAiResultBtn" class="primary">📋 複製整理結果</button>
        <button type="button" data-close="aiModal">關閉</button>
      </div>
    </div>
  </div>

  <!-- History Modal -->
  <div class="modal-bg" id="historyModal">
    <div class="modal">
      <div class="modal-head">
        <h2>📁 歷史回合紀錄</h2>
        <button type="button" data-close="historyModal">✕</button>
      </div>
      <div class="modal-body" id="historyBody"></div>
      <div class="modal-foot">
        <button type="button" id="clearHistoryBtn" style="color:#b91c1c;margin-right:auto;">清空歷史</button>
        <button type="button" id="exportHistoryBtn" class="primary">⬇️ 下載全部回合 (.md)</button>
      </div>
    </div>
  </div>

  <!-- Host PIN Modal -->
  <div class="modal-bg" id="pinModal">
    <div class="modal" style="max-width:420px;">
      <div class="modal-head">
        <h2 id="pinModalTitle">🔒 講師管理密碼</h2>
        <button type="button" data-close="pinModal">✕</button>
      </div>
      <div class="modal-body">
        <p id="pinModalDesc" style="margin:0;font-size:0.86rem;color:var(--muted);"></p>
        <div class="field">
          <label>管理密碼（至少 3 個字元，例如 4 位數 PIN）</label>
          <input id="inHostPin" type="password" placeholder="輸入密碼..." />
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" id="pinLockOutBtn" style="color:#b91c1c;margin-right:auto;display:none;">🔒 登出／鎖定本機</button>
        <button type="button" id="pinSubmitBtn" class="primary">確認</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <footer class="site-footer">
    屏東縣後庄國小黃朝榮老師作品，免費分享，歡迎擴散推廣，嚴禁商用與任何侵權、不尊重著作權的行為
    ｜ 更多 Puti-AI 教學工具：<a href="https://padlet.com/clongwh/puti_ai_tools" target="_blank" rel="noopener noreferrer">點此前往</a>
  </footer>

  <script>
    const STORE = "puti_universal_sticky_wall_v2";
    const MOBILE_NICK_KEY = "puti_wall_mobile_nick";
    const MOBILE_VOTED_KEY = "puti_wall_mobile_voted";
    const CLIENT_ID_KEY = "puti_wall_client_id";
    const HOST_PIN_KEY = "puti_wall_host_pin";
    const DEFAULT_SHEET_URL = "https://docs.google.com/spreadsheets/d/1yI2LXh3jrqaEsbV__IoUFcJuOOwoG3DbwBqYo82GWXU/edit?usp=drivesdk";
    const DEFAULT_FORM_URL = "https://forms.gle/52gecPdK85hRJQdL8";
    const DEFAULT_GAS_PROXY = "https://script.google.com/macros/s/AKfycbyw_vR_RPa8iDcnmJFxd7nRKFaBX-H2m-plX225TZSYbmOxf5Fg87LWBBcTSJnaoIG0/exec";
    const LIVE_HOST_BASE = "https://puti001.github.io/puti-sticky-wall/";

    const IS_MOBILE = new URLSearchParams(location.search).get("view") === "mobile";
    let state = load();
    let pollTimer = null;
    let topicDebounce = null;
    let qrMode = "mobile"; // mobile | form
    let serverHasPin = false;
    let hostUnlocked = false;

    function getClientId() {
      let id = localStorage.getItem(CLIENT_ID_KEY);
      if (!id) {
        id = "c-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
        try { localStorage.setItem(CLIENT_ID_KEY, id); } catch {}
      }
      return id;
    }

    function getHostPin() {
      return localStorage.getItem(HOST_PIN_KEY) || "";
    }

    function defaults() {
      return {
        round: 1,
        topic: "",
        sortBy: "new",
        bigFont: false,
        sync: {
          sheetUrl: DEFAULT_SHEET_URL,
          formUrl: DEFAULT_FORM_URL,
          autoPoll: true,
          gasProxyUrl: DEFAULT_GAS_PROXY,
          geminiKey: ""
        },
        notes: [],
        history: []
      };
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORE);
        if (!raw) return defaults();
        const p = JSON.parse(raw);
        const mergedSync = { ...defaults().sync, ...(p.sync || {}) };
        if (!mergedSync.sheetUrl) mergedSync.sheetUrl = DEFAULT_SHEET_URL;
        if (!mergedSync.formUrl) mergedSync.formUrl = DEFAULT_FORM_URL;
        if (!mergedSync.gasProxyUrl) mergedSync.gasProxyUrl = DEFAULT_GAS_PROXY;
        return { ...defaults(), ...p, sync: mergedSync };
      } catch { return defaults(); }
    }

    function save() {
      try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {}
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2200);
    }

    function esc(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    /* ---- GAS Two-Way API ---- */
    async function gasGetWall() {
      const url = (state.sync.gasProxyUrl || DEFAULT_GAS_PROXY).trim();
      const res = await fetch(url + "?_t=" + Date.now());
      const raw = await res.text();
      if (raw.trim().startsWith("<")) throw new Error("GAS 尚未開放權限");
      const data = JSON.parse(raw);
      if (!data.ok) throw new Error(data.error || "GAS 讀取失敗");
      return data;
    }

    async function gasPost(payload) {
      const url = (state.sync.gasProxyUrl || DEFAULT_GAS_PROXY).trim();
      const body = { ...payload, hostPin: getHostPin() };
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(body)
      });
      const raw = await res.text();
      if (raw.trim().startsWith("<")) throw new Error("GAS 尚未開放權限");
      const data = JSON.parse(raw);
      if (!data.ok) throw new Error(data.error || "操作失敗");
      return data;
    }

    async function verifyLocalHostPin() {
      if (!serverHasPin) { hostUnlocked = true; return; }
      const pin = getHostPin();
      if (!pin) { hostUnlocked = false; return; }
      try {
        const res = await gasPost({ action: "check_host_pin", hostPin: pin });
        hostUnlocked = Boolean(res.valid);
      } catch {
        hostUnlocked = false;
      }
    }

    async function applyServerState(data, isUserEditTopic = false) {
      if (typeof data.hasHostPin === "boolean") {
        const changed = data.hasHostPin !== serverHasPin;
        serverHasPin = data.hasHostPin;
        if (!serverHasPin) hostUnlocked = true;
        else if (changed) await verifyLocalHostPin();
      }
      if (typeof data.round === "number") state.round = data.round;
      if (typeof data.topic === "string" && !isUserEditTopic) {
        state.topic = data.topic;
        const tInput = document.getElementById("topicInput");
        if (tInput && document.activeElement !== tInput) tInput.value = data.topic;
      }
      if (Array.isArray(data.notes)) state.notes = data.notes;
      save();
      renderCurrentView();
    }

    async function syncWall(silent = false) {
      try {
        const data = await gasGetWall();
        const prevTopic = state.topic;
        const prevLen = state.notes.length;
        applyServerState(data);
        if (!silent) {
          toast(`🔄 已同步第 ${state.round} 輪（共 ${state.notes.length} 張）`);
        } else if (state.notes.length > prevLen || state.topic !== prevTopic) {
          // Subtle passive update
        }
      } catch (err) {
        if (!silent) toast("同步失敗：" + err.message);
      }
    }

    function setupPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      const dot = document.getElementById("syncDot");
      const txt = document.getElementById("syncText");
      if (dot) dot.classList.add("live");
      if (txt) txt.textContent = state.sync.autoPoll ? "即時連線" : "同步";
      if (IS_MOBILE || state.sync.autoPoll) {
        pollTimer = setInterval(() => syncWall(true), 5000);
      }
    }

    function getSortedNotes() {
      const arr = [...state.notes];
      if (state.sortBy === "votes") {
        arr.sort((a, b) => (b.starred - a.starred) || ((b.votes || 0) - (a.votes || 0)) || (b.ts - a.ts));
      } else {
        arr.sort((a, b) => (b.ts || 0) - (a.ts || 0));
      }
      return arr;
    }

    /* ---- QR Modal Logic ---- */
    function renderQrModal() {
      const body = document.getElementById("qrBody");
      const maxBtn = document.getElementById("qrMaxToggleBtn");
      const swBtn = document.getElementById("qrSwitchModeBtn");
      toggleQrMax(false);

      const mobileBase = location.protocol === "file:" ? LIVE_HOST_BASE : (location.origin + location.pathname);
      const mobileUrl = mobileBase + "?view=mobile";
      const formUrl = (state.sync.formUrl || "").trim();

      const targetUrl = qrMode === "mobile" ? mobileUrl : formUrl;
      swBtn.textContent = qrMode === "mobile" ? "切換成 Google 表單 QR" : "切回手機互動牆 QR（可按讚）";

      if (targetUrl) {
        maxBtn.style.display = "inline-flex";
        body.innerHTML = `
          <img id="qrZoomImg" class="qr-img-zoomable" src="https://api.qrserver.com/v1/create-qr-code/?size=640x640&data=${encodeURIComponent(targetUrl)}" alt="QR Code" title="點擊放到最大 / 縮小" />
          <p style="margin:0.5rem 0 0;font-size:1rem;font-weight:800;">
            ${qrMode === "mobile" ? "📱 掃碼進入「手機互動牆」：可發文＋互相按 👍！" : "📝 掃碼填寫 Google 表單"}
          </p>
          <span style="font-size:0.78rem;color:var(--subtle);">💡 再點一下 QR Code 圖片即可放到全螢幕最大</span>
        `;
        document.getElementById("qrZoomImg").onclick = () => toggleQrMax();
      } else {
        maxBtn.style.display = "none";
        body.innerHTML = `<p style="color:var(--muted);">尚未設定 Google 表單網址。</p>`;
      }
    }

    function toggleQrMax(force) {
      const card = document.getElementById("qrModalCard");
      const isMax = typeof force === "boolean" ? force : !card.classList.contains("qr-max");
      card.classList.toggle("qr-max", isMax);
      const tBtn = document.getElementById("qrMaxToggleBtn");
      if (tBtn) tBtn.textContent = isMax ? "🗗 還原大小" : "⛶ 放到最大";
    }
    document.getElementById("qrMaxToggleBtn").onclick = () => toggleQrMax();
    document.getElementById("qrSwitchModeBtn").onclick = () => {
      qrMode = qrMode === "mobile" ? "form" : "mobile";
      renderQrModal();
    };

    /* ---- AI Prompt & Direct Gemini ---- */
    function buildAiPrompt() {
      const topic = state.topic.trim() || "現場討論主題（由講師口頭說明）";
      const sorted = [...state.notes].sort((a, b) => (b.starred - a.starred) || ((b.votes || 0) - (a.votes || 0)));
      const lines = sorted.map((n, i) => `${i + 1}. ${n.starred ? "★[重點] " : ""}[${n.author}｜👍${n.votes || 0}] ${n.text}`).join("\n");
      return `以下是我們現場共創討論收集到的所有便利貼：

【本輪討論題目】
${topic}

【大家貼上的便利貼（共 ${sorted.length} 張）】
${lines}

請幫我們：
1. 把這些點子歸納成 3–5 個清楚的主軸或共識重點（保留提出者的組別／暱稱）。
2. 特別點出被標記「★」或高票「👍」的創意亮點。
3. 最後條列出「接下來可以直接拿來教學／執行的具體行動方案」。`;
    }

    async function runDirectGemini() {
      if (!state.notes.length) { toast("牆上還沒有便利貼喔！"); return; }
      const proxyUrl = (state.sync.gasProxyUrl || DEFAULT_GAS_PROXY).trim();
      const key = (state.sync.geminiKey || "").trim();
      document.getElementById("aiOutputBox").textContent = "⏳ AI 正在閱讀牆上所有便利貼並統整中...";
      openModal("aiModal");
      try {
        let text = "";
        if (proxyUrl) {
          const data = await gasPost({ action: "ai", prompt: buildAiPrompt() });
          text = data.text || "";
        } else if (key) {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: buildAiPrompt() }] }] })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message || res.status);
          text = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
        } else {
          throw new Error("未設定 GAS 代理或 Gemini Key");
        }
        document.getElementById("aiOutputBox").textContent = text || "無回傳內容";
        state.lastSummary = text;
        save();
      } catch (err) {
        document.getElementById("aiOutputBox").textContent = "整理失敗：" + err.message;
      }
    }

    /* ---- Global Modals ---- */
    function openModal(id) { document.getElementById(id).classList.add("open"); }
    function closeModal(id) { document.getElementById(id).classList.remove("open"); }
    document.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => closeModal(b.dataset.close));
    document.querySelectorAll(".modal-bg").forEach((bg) => bg.onclick = (e) => { if (e.target === bg) bg.classList.remove("open"); });

    document.getElementById("copyAiResultBtn").onclick = async () => {
      try { await navigator.clipboard.writeText(document.getElementById("aiOutputBox").textContent); toast("已複製整理結果！"); } catch {}
    };

    document.getElementById("testProxyBtn").onclick = async () => {
      const url = document.getElementById("inGasProxyUrl").value.trim();
      const msgEl = document.getElementById("proxyStatusMsg");
      if (!url) { msgEl.textContent = "請先填入 GAS 網址"; return; }
      msgEl.textContent = "⏳ 測試連線中...";
      try {
        const res = await fetch(url + "?_t=" + Date.now());
        const raw = await res.text();
        if (raw.trim().startsWith("<")) {
          msgEl.textContent = "⚠️ 尚未開通：請確認 GAS 部署權限為「所有人」";
          msgEl.style.color = "#b91c1c";
          return;
        }
        const data = JSON.parse(raw);
        msgEl.textContent = data.ok && data.hasKey
          ? `✅ 連線成功！目前第 ${data.round} 輪（${(data.notes || []).length} 張便利貼），Gemini Key 已就緒！`
          : "✅ 已連上 GAS，但尚未設定 GEMINI_API_KEY";
        msgEl.style.color = data.hasKey ? "#15803d" : "#b45309";
      } catch (e) {
        msgEl.textContent = "❌ 連線失敗：" + e.message;
        msgEl.style.color = "#b91c1c";
      }
    };

    document.getElementById("saveSetupBtn").onclick = async () => {
      state.sync.gasProxyUrl = document.getElementById("inGasProxyUrl").value.trim() || DEFAULT_GAS_PROXY;
      state.sync.autoPoll = document.getElementById("inAutoPoll").checked;
      state.sync.sheetUrl = document.getElementById("inSheetUrl").value.trim();
      state.sync.formUrl = document.getElementById("inFormUrl").value.trim();
      state.sync.geminiKey = document.getElementById("inGeminiKey").value.trim();
      save(); setupPolling(); closeModal("setupModal");
      await syncWall(false);
    };

    document.getElementById("demoBtn").onclick = async () => {
      closeModal("setupModal");
      const samples = [
        { author: "第1組 美玲", text: "讓學生帶昨晚家裡餐桌照片來分類，超有生活感！" },
        { author: "第2組 阿哲", text: "前 5 分鐘直接用兩張便當照投票，不用講太多大道理。" },
        { author: "第3組 小琪", text: "發卡片時很容易暴動，要先約定「手放背後倒數完才准翻牌」。" }
      ];
      for (const s of samples) {
        try { await gasPost({ action: "add", author: s.author, text: s.text }); } catch {}
      }
      await syncWall(false);
    };

    document.getElementById("pinLockOutBtn").onclick = () => {
      localStorage.removeItem(HOST_PIN_KEY);
      hostUnlocked = false;
      closeModal("pinModal");
      renderHostWall();
      toast("🔒 已鎖定本機管理權限");
    };

    document.getElementById("pinSubmitBtn").onclick = async () => {
      const pin = document.getElementById("inHostPin").value.trim();
      if (!pin || pin.length < 3) { toast("密碼至少需要 3 個字元"); return; }
      try {
        if (!serverHasPin || hostUnlocked) {
          const res = await gasPost({ action: "set_host_pin", newPin: pin, hostPin: getHostPin() });
          if (res.ok) {
            localStorage.setItem(HOST_PIN_KEY, pin);
            serverHasPin = true;
            hostUnlocked = true;
            closeModal("pinModal");
            renderHostWall();
            toast("🛡️ 講師管理密碼已設定並解鎖本機！");
          }
        } else {
          const res = await gasPost({ action: "check_host_pin", hostPin: pin });
          if (res.valid) {
            localStorage.setItem(HOST_PIN_KEY, pin);
            hostUnlocked = true;
            closeModal("pinModal");
            renderHostWall();
            toast("🔓 已解鎖講師管理權限！");
          } else {
            toast("❌ 密碼不正確");
          }
        }
      } catch (err) {
        toast("失敗：" + err.message);
      }
    };
    document.getElementById("inHostPin").onkeydown = (e) => {
      if (e.key === "Enter") document.getElementById("pinSubmitBtn").click();
    };

    document.getElementById("clearHistoryBtn").onclick = () => {
      if (!state.history.length || !confirm("確定清空所有歷史回合紀錄？")) return;
      state.history = []; save(); renderHostWall(); closeModal("historyModal");
    };

    document.getElementById("exportHistoryBtn").onclick = () => {
      const rounds = [
        ...(state.notes.length ? [{ round: state.round, topic: state.topic || `第 ${state.round} 輪`, notes: state.notes }] : []),
        ...state.history
      ];
      if (!rounds.length) { toast("目前沒有可匯出的便利貼"); return; }
      const md = rounds.map((r) => [
        `## 第 ${r.round} 輪｜${r.topic}`,
        ...r.notes.map((n) => `- ${n.starred ? "★ " : ""}[${n.author}｜👍${n.votes || 0}] ${n.text}`),
        ""
      ].join("\n")).join("\n");
      const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
      const u = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = u; a.download = "現場共創便利貼紀錄.md"; a.click();
      URL.revokeObjectURL(u);
    };

    function renderCurrentView() {
      if (IS_MOBILE) renderMobileWall();
      else renderHostWall();
    }

    // Boot
    if (IS_MOBILE) renderMobileShell();
    else renderHostShell();
    setupPolling();
    syncWall(true);
  </script>
</body>
</html>
